{% extends "base.html" %}
{% block title %}Mes certificats{% endblock %}

{% block content %}

<div class="page-header">
  <div class="page-header__top">
    <div>
      <h1>Mes certificats</h1>
      <p>Gérez l'ensemble des certificats émis par votre institution</p>
    </div>
    <a href="/create-certificate" class="btn btn-primary">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
      Émettre un certificat
    </a>
  </div>
</div>


<!-- ─── Stats ────────────────────────────────────────── -->
<div style="display:grid; grid-template-columns: repeat(4, 1fr); gap:1.25rem; margin-bottom:2rem;" id="statsRow">
  <div class="stat-card">
    <div class="stat-icon stat-icon--navy">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/></svg>
    </div>
    <div class="stat-value" id="s-total">—</div>
    <div class="stat-label">Total</div>
  </div>
  <div class="stat-card">
    <div class="stat-icon stat-icon--navy">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/></svg>
    </div>
    <div class="stat-value" id="s-diplomes">—</div>
    <div class="stat-label">Diplômes</div>
  </div>
  <div class="stat-card">
    <div class="stat-icon stat-icon--blue">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 12l2 2 4-4M7.835 4.697a3.42 3.42 0 001.946-.806 3.42 3.42 0 014.438 0 3.42 3.42 0 001.946.806 3.42 3.42 0 013.138 3.138 3.42 3.42 0 00.806 1.946 3.42 3.42 0 010 4.438 3.42 3.42 0 00-.806 1.946 3.42 3.42 0 01-3.138 3.138 3.42 3.42 0 00-1.946.806 3.42 3.42 0 01-4.438 0 3.42 3.42 0 00-1.946-.806 3.42 3.42 0 01-3.138-3.138 3.42 3.42 0 00-.806-1.946 3.42 3.42 0 010-4.438 3.42 3.42 0 00.806-1.946 3.42 3.42 0 013.138-3.138z"/></svg>
    </div>
    <div class="stat-value" id="s-certs">—</div>
    <div class="stat-label">Certifications</div>
  </div>
  <div class="stat-card">
    <div class="stat-icon stat-icon--success">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="6"/><path d="M15.477 12.89L17 22l-5-3-5 3 1.523-9.11"/></svg>
    </div>
    <div class="stat-value" id="s-badges">—</div>
    <div class="stat-label">Badges</div>
  </div>
</div>


<!-- ─── Filters ──────────────────────────────────────── -->
<div class="card" style="margin-bottom:1.5rem;">
  <div class="card-body-sm" style="display:flex; align-items:center; gap:1rem; flex-wrap:wrap;">

    <div style="display:flex; align-items:center; gap:0.5rem; flex:1; min-width:200px;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--text-muted)" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input class="form-input" type="text" id="searchInput" placeholder="Rechercher un bénéficiaire…" style="border:none; background:none; padding:0; font-size:0.875rem; box-shadow:none;">
    </div>

    <div style="width:1px; height:24px; background:var(--border); flex-shrink:0;"></div>

    <select class="form-select" id="filterType" style="width:auto; min-width:160px;">
      <option value="">Tous les types</option>
      <option value="diplome">Diplôme</option>
      <option value="certification">Certification</option>
      <option value="badge">Badge</option>
    </select>

    <select class="form-select" id="filterStatus" style="width:auto; min-width:160px;">
      <option value="">Tous les statuts</option>
      <option value="created">Créé</option>
      <option value="issued">Émis sur blockchain</option>
    </select>

  </div>
</div>


<!-- ─── Certificates List ────────────────────────────── -->
<div id="certsList"></div>

{% endblock %}

{% block scripts %}
<script>
  let allCerts = [];

  const typeColors  = { diplome:'badge-navy', certification:'badge-info', badge:'badge-warning' };
  const typeLabels  = { diplome:'Diplôme', certification:'Certification', badge:'Badge' };
  const statusColors = { created:'badge-info', issued:'badge-teal' };
  const statusLabels = { created:'Créé', issued:'Blockchain' };

  async function load() {
    try {
      const res  = await fetch('/api/certificates');
      const data = await res.json();
      allCerts   = data.certificates || [];
      updateStats();
      render(allCerts);
    } catch (e) {
      document.getElementById('certsList').innerHTML = `<div class="alert alert-error">Impossible de charger les certificats.</div>`;
    }
  }

  function updateStats() {
    document.getElementById('s-total').textContent   = allCerts.length;
    document.getElementById('s-diplomes').textContent = allCerts.filter(c => c.certificate_type === 'diplome').length;
    document.getElementById('s-certs').textContent    = allCerts.filter(c => c.certificate_type === 'certification').length;
    document.getElementById('s-badges').textContent   = allCerts.filter(c => c.certificate_type === 'badge').length;
  }

  function render(list) {
    const el = document.getElementById('certsList');
    if (list.length === 0) {
      el.innerHTML = `
        <div class="empty-state">
          <div class="empty-state__icon">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
              <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/>
            </svg>
          </div>
          <h2>Aucun certificat trouvé</h2>
          <p>Commencez par émettre votre premier certificat numérique.</p>
          <a href="/create-certificate" class="btn btn-primary">Émettre un certificat</a>
        </div>`;
      return;
    }

    el.innerHTML = `<div class="certs-grid">${list.map(c => `
      <div class="cert-card" style="border-left-color: ${c.certificate_type === 'diplome' ? 'var(--navy-800)' : c.certificate_type === 'certification' ? 'var(--blue-500)' : 'var(--warning)'};">
        <div class="cert-card__header">
          <span class="badge ${typeColors[c.certificate_type] || 'badge-navy'}">${typeLabels[c.certificate_type] || c.certificate_type}</span>
          <span class="badge ${c.blockchain_hash ? 'badge-teal' : 'badge-info'}">
            ${c.blockchain_hash
              ? '<svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg> Blockchain'
              : 'Local'}
          </span>
        </div>
        <div class="cert-card__body">
          <div style="font-size:1rem; font-weight:700; color:var(--text-primary); margin-bottom:0.875rem;">${c.recipient_name}</div>
          <div class="cert-card__row">
            <span class="cert-card__row-label">Domaine</span>
            <span class="cert-card__row-value">${c.domain || '—'}</span>
          </div>
          ${c.mention ? `<div class="cert-card__row"><span class="cert-card__row-label">Mention</span><span class="cert-card__row-value">${c.mention}</span></div>` : ''}
          <div class="cert-card__row">
            <span class="cert-card__row-label">Émis le</span>
            <span class="cert-card__row-value">${new Date(c.created_at).toLocaleDateString('fr-FR')}</span>
          </div>
          ${c.blockchain_hash ? `
          <div class="cert-card__row" style="border-bottom:none;">
            <span class="cert-card__row-label">Hash TX</span>
            <span style="font-family:monospace; font-size:0.72rem; color:var(--text-muted);">${c.blockchain_hash.substring(0,18)}…</span>
          </div>` : ''}
        </div>
        <div class="cert-card__actions">
          <a href="/certificate/${c.id}/download" class="btn btn-outline btn-sm" style="flex:1;">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            PDF
          </a>
          ${c.ipfs_hash ? `
          <a href="https://gateway.pinata.cloud/ipfs/${c.ipfs_hash}" target="_blank" rel="noopener" class="btn btn-ghost btn-sm" style="flex:1;">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M10 13a5 5 0 007.54.54l3-3a5 5 0 00-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 00-7.54-.54l-3 3a5 5 0 007.07 7.07l1.71-1.71"/></svg>
            IPFS
          </a>` : ''}
          <button onclick="deleteCert(${c.id})" class="btn btn-ghost btn-sm" style="color:var(--error);">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/><path d="M10 11v6M14 11v6M9 6V4h6v2"/></svg>
          </button>
        </div>
      </div>
    `).join('')}</div>`;
  }

  function filter() {
    const type   = document.getElementById('filterType').value;
    const status = document.getElementById('filterStatus').value;
    const search = document.getElementById('searchInput').value.toLowerCase();
    render(allCerts.filter(c =>
      (!type   || c.certificate_type === type) &&
      (!status || (status === 'issued' ? !!c.blockchain_hash : !c.blockchain_hash)) &&
      (!search || c.recipient_name.toLowerCase().includes(search))
    ));
  }

  async function deleteCert(id) {
    if (!confirm('Supprimer ce certificat ? Cette action est irréversible.')) return;
    try {
      const res = await fetch(`/api/certificates/${id}`, { method: 'DELETE' });
      if (res.ok) { await load(); }
    } catch (e) { alert('Erreur lors de la suppression.'); }
  }

  document.getElementById('filterType').addEventListener('change', filter);
  document.getElementById('filterStatus').addEventListener('change', filter);
  document.getElementById('searchInput').addEventListener('input', filter);

  document.addEventListener('DOMContentLoaded', load);
</script>

<style>
@media (max-width: 900px) {
  #statsRow { grid-template-columns: repeat(2,1fr) !important; }
}
@media (max-width: 500px) {
  #statsRow { grid-template-columns: 1fr !important; }
}
</style>
{% endblock %}
